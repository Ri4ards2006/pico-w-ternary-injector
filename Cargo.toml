[package]
name = "pico-w-ternary-injector"
version = "0.1.0"
edition = "2024"
description = "Pico W wireless bridge: TCP-received 2B1T weights -> PIO dual-rail ternary signals for the Tang Nano 9K"

[lib]
path = "src/lib.rs"
test = true

[[bin]]
name = "pico-w-ternary-injector"
path = "src/main.rs"
test = false
bench = false

[dependencies]
pio = "0.3"

[target.'cfg(target_arch = "arm")'.dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-rp = { version = "0.10", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-net = { version = "0.9", features = ["defmt", "tcp", "dhcpv4", "proto-ipv4", "medium-ethernet"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8", features = ["defmt"] }
cyw43 = { version = "0.7", features = ["defmt"] }
cyw43-pio = { version = "0.10", features = ["defmt"] }
static_cell = "2"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
portable-atomic = { version = "1", features = ["critical-section"] }

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"
codegen-units = 1
incremental = false

[profile.dev]
opt-level = 1
